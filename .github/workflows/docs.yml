name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "knapsack-bench/src/main/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "knapsack-bench/src/main/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch published results
        run: |
          if git fetch --depth=1 origin results; then
            git worktree add results-branch FETCH_HEAD
          else
            echo "La rama results todavía no existe: se publica sin resultados."
            mkdir -p results-branch/results
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate result pages
        run: ./mvnw -B -q compile exec:java -Dexec.args="report --results=results-branch/results --output=docs/resultados"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Build site
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

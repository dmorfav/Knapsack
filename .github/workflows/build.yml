name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Download Code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build, test and package
        run: ./mvnw -B verify
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: knapsack-core/target/site/jacoco/jacoco.xml,knapsack-algorithms/target/site/jacoco/jacoco.xml,knapsack-baselines/target/site/jacoco/jacoco.xml,knapsack-bench/target/site/jacoco/jacoco.xml
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: knapsack-*/target/*.jar
      - name: Verify declared optima
        if: matrix.os == 'ubuntu-latest'
        run: ./mvnw -B -q compile exec:java -Dexec.args="optimum $(find instances -name '*.json' | sort | tr '\n' ' ')"
      - name: Verify instance suites
        if: matrix.os == 'ubuntu-latest'
        run: |
          for suite in instances/*/suite.yaml; do
            ./mvnw -B -q compile exec:java -Dexec.args="suite --check $suite"
          done
      - name: Run App
        run: ./mvnw -B compile exec:java

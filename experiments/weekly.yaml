# Ejecución semanal en GitHub Actions sobre la suite v1 (instances/suite-v1/suite.yaml). Cambiar las instancias
# cambia el "conjunto de instancias" y rompe la comparabilidad de la evolución: hazlo de forma deliberada.
name: weekly
description: Ejecución semanal de todos los solvers registrados sobre la suite v1 (54 instancias de Pisinger con óptimo).
instances:
  - instances/suite-v1/*.json
solvers:
  - "*"
runs: 30
firstSeed: 1
warmupRuns: 2
budget:
  maxEvaluations: 50000
  maxSeconds: 10
